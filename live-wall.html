<main><figure data-id="85837859-3e5d-4e1b-8740-1c2ea3ed5662"><img alt="Broome St and Lafayette St"><figcaption><b>Broome St and Lafayette St</b> · 197 m · <a href="https://webcams.nyctmc.org/" target="_blank" rel="noopener">DOT</a></figcaption></figure><figure data-id="93dea5a7-a63f-4415-ae12-f32b62540f11"><img alt="Kenmare St @ Cleveland pl"><figcaption><b>Kenmare St @ Cleveland pl</b> · 198 m · <a href="https://webcams.nyctmc.org/" target="_blank" rel="noopener">DOT</a></figcaption></figure><figure data-id="c733e881-862d-4874-9d00-9bfdc3b27cbc"><img alt="Grand St @ Bowery"><figcaption><b>Grand St @ Bowery</b> · 206 m · <a href="https://webcams.nyctmc.org/" target="_blank" rel="noopener">DOT</a></figcaption></figure><figure data-id="a3058350-1552-459f-8379-2fd06895e70a"><img alt="Delancey St @ Bowery St "><figcaption><b>Delancey St @ Bowery St </b> · 208 m · <a href="https://webcams.nyctmc.org/" target="_blank" rel="noopener">DOT</a></figcaption></figure><figure data-id="96be7098-dda4-42da-bfe2-55bc5c6b94fb"><img alt="Baxter St @ Canal Street"><figcaption><b>Baxter St @ Canal Street</b> · 353 m · <a href="https://webcams.nyctmc.org/" target="_blank" rel="noopener">DOT</a></figcaption></figure><figure data-id="63e79f0b-7dea-4c8e-864c-f3315f9cc62c"><img alt="Grand St @ Broadway"><figcaption><b>Grand St @ Broadway</b> · 376 m · <a href="https://webcams.nyctmc.org/" target="_blank" rel="noopener">DOT</a></figcaption></figure></main>
<p>The nearest camera is 197 m from the door. None of them sees Mott Street or the door itself; they watch Broome, Kenmare, Grand, Delancey and Canal. The city keeps no recordings; this wall refreshes the public feeds every 20 seconds.</p>
<script>
const figs=[...document.querySelectorAll('figure')]; let on=true;
function refresh(){ const ts=Date.now(); figs.forEach(f=>{ f.querySelector('img').src='https://webcams.nyctmc.org/api/cameras/'+f.dataset.id+'/image?t='+ts; }); document.getElementById('t').textContent='refreshed '+new Date().toLocaleTimeString('en-US',{timeZone:'America/New_York'})+' NYC'; }
refresh(); setInterval(()=>{ if(on) refresh(); }, 20000);
document.getElementById('p').onclick=e=>{ on=!on; e.target.textContent=on?'Pause':'Resume'; };
</script></body></html>
